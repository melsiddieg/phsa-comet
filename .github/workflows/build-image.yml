name: Build production image

# Builds the production image on GitHub's runners (open internet, native
# amd64) and pushes it to GHCR. Use this when the deployment server cannot
# reach Alpine's package mirrors — the server then only needs to `docker
# pull`, which works through most restrictive proxies.
#
# Consume it by setting COMET_IMAGE in .env.production, e.g.
#   COMET_IMAGE=ghcr.io/melsiddieg/phsa-comet:latest
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: short SHA)'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        run: |
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag="${GITHUB_SHA::7}"
          repo=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "tag=$tag"
            echo "tags=$repo:$tag,$repo:latest"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: modern
          file: modern/docker/production/Dockerfile
          platforms: linux/amd64      # deployment servers are amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          repo=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "### Image pushed"
            echo ""
            echo '```bash'
            echo "# on the server, in modern/.env.production"
            echo "COMET_IMAGE=$repo:${{ steps.meta.outputs.tag }}"
            echo '```'
            echo ""
            echo "If the package is private, the server needs:"
            echo '```bash'
            echo "echo <PAT-with-read:packages> | docker login ghcr.io -u <github-user> --password-stdin"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
