; COMET production PHP overrides (on top of php.ini-production)

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120

; Opcache — code is baked into the image, so never revalidate
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Sessions live in the database (SESSION_DRIVER=database)
