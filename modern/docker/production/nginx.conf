# COMET production nginx — single-container layout (php-fpm on localhost).
# Listens on 8080 so the container never needs a privileged port.

worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Azure front ends (Container Apps ingress / App Gateway) terminate TLS
    # and forward X-Forwarded-*; Laravel's trusted-proxy handling reads them.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        root /var/www/html/public;
        index index.php;

        client_max_body_size 64m;

        # Never serve dotfiles (except ACME well-known)
        location ~ /\.(?!well-known) { deny all; }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 300;
        }

        # Static assets: long cache, immutable
        location ~* \.(css|js|ico|svg|png|jpg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }
}
