name: comet-modern

services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: comet_modern_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: comet
      POSTGRES_USER: comet_app
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_app_pw
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comet_app -d comet"]
      interval: 5s
      retries: 30
    secrets: [pg_app_pw]
    networks: [comet_modern_net]

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: comet_modern_redis
    restart: unless-stopped
    networks: [comet_modern_net]

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: comet_modern_app
    restart: unless-stopped
    # Laravel reads the bind-mounted .env itself; injecting it as process env
    # would override phpunit's test environment and freeze config values.
    volumes:
      - .:/var/www/html
      - ../public/mr_data:/var/www/mr_data:ro   # legacy Cerner extracts for the import pipeline
      - ../vocab_data:/var/www/vocab_data:ro    # Athena downloads for the vocab loader
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    secrets: [pg_app_pw]
    networks: [comet_modern_net]

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: comet_modern_queue
    restart: unless-stopped
    # Laravel reads the bind-mounted .env itself; injecting it as process env
    # would override phpunit's test environment and freeze config values.
    command: php artisan queue:work --tries=3 --timeout=3600
    volumes:
      - .:/var/www/html
      - ../public/mr_data:/var/www/mr_data:ro
      - ../vocab_data:/var/www/vocab_data:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    secrets: [pg_app_pw]
    networks: [comet_modern_net]

  web:
    image: docker.io/library/nginx:1.27-alpine
    container_name: comet_modern_web
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [comet_modern_net]

secrets:
  pg_app_pw:
    file: ../secrets/pg_app_pw.txt

volumes:
  pg_data: {}

networks:
  comet_modern_net:
    driver: bridge
