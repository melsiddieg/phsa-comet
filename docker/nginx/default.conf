upstream comet_php { server app:9000; }

server {
    listen 80;
    root /var/www/html;       # must match the bind mount :contentReference[oaicite:12]{index=12}
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass comet_php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}

